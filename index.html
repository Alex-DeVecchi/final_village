<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="styles/style.css">
        <script src="src/build.js"></script>
        <script src="src/update.js"></script>
        <script src="src/firemaster.js"></script>

    <body>
        <header>
            <h1>Final Village</h1>
            <h2>
                You are your last village hope...
            </h2>
        </header>

        <div class="outer">
            <div class="click">
        <h3>Score: <span class="score" id="score">0</span></h3>

        <button type="button" onclick="scorePlusPlus()">Click Me!</button>
    </div>

    <div class="store">
        <div class="buildings">
            <div class="store-title">
        <h4>Buildings:</h4>
            </div>

        <button class="button" type="button" id="buySlash" onclick="slash.purchase()">
            Buy Slash
        </button>
        <button class="button" type="button" id="buyWaterGun" onclick="waterGun.purchase()">
            Buy WaterGun
        </button>

        <button class="button" type="button" id="buyFireball" onclick="fireball.purchase()">
            Buy fireball
        </button>

        <button class="button" type="button" id="buyRockThrow" onclick="rockThrow.purchase()">
            Buy rockThrow
        </button>

        <button class="button" type="button" id="buyWindBlow" onclick="windBlow.purchase()">
            Buy windBlow
        </button>

        <button class="button" type="button" id="buyPoisonThrow" onclick="poisonThrow.purchase()">
            Buy poisonThrow
        </button>
    </div>

    <div class="uprades">
        <div class="store-title">
        <h4>Uprades:</h4>
    </div>
        <button class="button" type="button" id="buySwordmasterI" onclick="swordmaster1.purchase()"></button>

        <button class="button" type="button" id="buySwordmasterII" onclick="swordmaster2.purchase()"></button>

        <button class="button" type="button" id="buyWatermasterI" onclick="watermaster1.purchase()"></button>

        <button class="button" type="button" id="buyFiremasterI" onclick="firemaster1.purchase()"></button>

        <button class="button" type="button" id="buyEarthmasterI" onclick="earthmaster1.purchase()"></button>

        <button class="button" type="button" id="buyAirmasterI" onclick="airmaster1.purchase()"></button>

        <button class="button" type="button" id="buytoxicmasterI" onclick="toxicmaster1.purchase()"></button>

    </div>
    </div>
    </div>

</html>
